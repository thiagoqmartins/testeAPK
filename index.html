<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1923">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orçamento">
<title>Orçamento Familiar</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f18;
    --surface: #111823;
    --surface2: #1a2435;
    --surface3: #1e2d42;
    --border: #243047;
    --accent: #00d4aa;
    --accent2: #0098d4;
    --danger: #ff4d6a;
    --warning: #ffb347;
    --success: #00d4aa;
    --text: #e8f0fc;
    --text2: #7a92b4;
    --text3: #4a6080;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 12px;
    --radius-lg: 20px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--sans); }

  /* HEADER */
  #app-header {
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:linear-gradient(180deg, var(--bg) 80%, transparent);
    padding:16px 16px 0;
    display:flex; align-items:center; justify-content:space-between;
  }
  .header-title { font-family:var(--mono); font-size:13px; color:var(--text2); letter-spacing:2px; text-transform:uppercase; }
  .header-month { font-family:var(--mono); font-size:16px; color:var(--accent); font-weight:700; }
  #btn-settings { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; color:var(--text2); font-size:18px; cursor:pointer; }

  /* MAIN SCROLL */
  #main-scroll { position:fixed; top:80px; bottom:70px; left:0; right:0; overflow-y:auto; padding:0 16px 16px; -webkit-overflow-scrolling:touch; scroll-behavior:smooth; }

  /* SUMMARY CARD */
  .summary-card {
    background:linear-gradient(135deg, var(--surface2) 0%, var(--surface3) 100%);
    border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:20px; margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .summary-label { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:1.5px; font-family:var(--mono); margin-bottom:4px; }
  .summary-value { font-family:var(--mono); font-size:28px; font-weight:700; }
  .summary-value.positive { color:var(--accent); }
  .summary-value.negative { color:var(--danger); }
  .summary-row { display:flex; gap:12px; margin-top:16px; }
  .summary-mini { flex:1; background:var(--surface); border-radius:10px; padding:12px; border:1px solid var(--border); }
  .summary-mini .val { font-family:var(--mono); font-size:16px; font-weight:700; }
  .summary-mini .lbl { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }

  /* PROGRESS BAR */
  .progress-section { margin-top:14px; }
  .progress-label { display:flex; justify-content:space-between; font-size:11px; color:var(--text2); margin-bottom:6px; }
  .progress-bar { height:6px; background:var(--surface); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; border-radius:3px; transition:width 0.5s ease; }

  /* MONTH NAV */
  .month-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .month-nav-btn { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 16px; color:var(--text); font-size:16px; cursor:pointer; }
  .month-nav-label { font-family:var(--mono); font-size:14px; color:var(--text); text-align:center; }

  /* SECTION TITLE */
  .section-title { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:1.5px; font-family:var(--mono); margin-bottom:10px; margin-top:20px; display:flex; align-items:center; gap:8px; }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }

  /* TRANSACTION LIST */
  .tx-list { display:flex; flex-direction:column; gap:8px; }
  .tx-item {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; display:flex; align-items:center; gap:12px;
    cursor:pointer; transition:all 0.15s; position:relative; overflow:hidden;
  }
  .tx-item:active { transform:scale(0.98); background:var(--surface2); }
  .tx-item::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:3px 0 0 3px; }
  .tx-item.income::before { background:var(--accent); }
  .tx-item.expense::before { background:var(--danger); }
  .tx-item.fixed-expense::before { background:var(--warning); }
  .tx-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .tx-icon.income { background:rgba(0,212,170,0.12); }
  .tx-icon.expense { background:rgba(255,77,106,0.12); }
  .tx-icon.fixed-expense { background:rgba(255,179,71,0.12); }
  .tx-info { flex:1; min-width:0; }
  .tx-desc { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx-meta { font-size:11px; color:var(--text3); margin-top:2px; }
  .tx-amount { font-family:var(--mono); font-size:15px; font-weight:700; flex-shrink:0; }
  .tx-amount.income { color:var(--accent); }
  .tx-amount.expense { color:var(--danger); }
  .tx-amount.fixed-expense { color:var(--warning); }

  /* FIXED EXPENSES */
  .fixed-card {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; transition:all 0.15s;
  }
  .fixed-card:active { transform:scale(0.98); }
  .fixed-card-left { display:flex; align-items:center; gap:10px; }
  .fixed-day-badge { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:4px 8px; font-family:var(--mono); font-size:11px; color:var(--text2); }

  /* BOTTOM NAV */
  #bottom-nav {
    position:fixed; bottom:0; left:0; right:0; z-index:100;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; padding:8px 0 max(8px, env(safe-area-inset-bottom));
  }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px; cursor:pointer; transition:all 0.15s; border:none; background:none; color:var(--text3); }
  .nav-btn.active { color:var(--accent); }
  .nav-icon { font-size:20px; }
  .nav-label { font-size:9px; text-transform:uppercase; letter-spacing:1px; font-family:var(--mono); }

  /* FAB */
  #fab {
    position:fixed; bottom:90px; right:20px; z-index:200;
    width:56px; height:56px; border-radius:18px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    border:none; color:#000; font-size:28px; font-weight:300;
    box-shadow:0 8px 32px rgba(0,212,170,0.4);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all 0.2s;
  }
  #fab:active { transform:scale(0.9); }

  /* MODAL */
  .modal-overlay {
    position:fixed; inset:0; z-index:300;
    background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
    display:flex; align-items:flex-end;
    opacity:0; pointer-events:none; transition:opacity 0.25s;
  }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal-sheet {
    width:100%; background:var(--surface); border-radius:24px 24px 0 0;
    padding:20px 20px max(20px, env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform 0.3s cubic-bezier(.4,0,.2,1);
    max-height:90vh; overflow-y:auto;
  }
  .modal-overlay.open .modal-sheet { transform:translateY(0); }
  .modal-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 20px; }
  .modal-title { font-family:var(--mono); font-size:14px; color:var(--text2); margin-bottom:20px; letter-spacing:1px; text-transform:uppercase; }

  /* FORM */
  .form-group { margin-bottom:16px; }
  .form-label { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; font-family:var(--mono); margin-bottom:8px; display:block; }
  .form-input {
    width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    padding:14px; color:var(--text); font-family:var(--sans); font-size:16px;
    outline:none; transition:border-color 0.2s; -webkit-appearance:none;
  }
  .form-input:focus { border-color:var(--accent); }
  .form-input::placeholder { color:var(--text3); }
  select.form-input { cursor:pointer; }
  .type-selector { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .type-btn { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px 8px; text-align:center; cursor:pointer; transition:all 0.15s; font-size:12px; color:var(--text2); }
  .type-btn.selected.income { background:rgba(0,212,170,0.15); border-color:var(--accent); color:var(--accent); }
  .type-btn.selected.expense { background:rgba(255,77,106,0.15); border-color:var(--danger); color:var(--danger); }
  .type-btn.selected.fixed { background:rgba(255,179,71,0.15); border-color:var(--warning); color:var(--warning); }
  .type-emoji { font-size:22px; display:block; margin-bottom:4px; }
  .btn-primary {
    width:100%; padding:16px; border:none; border-radius:12px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:#000; font-family:var(--sans); font-size:16px; font-weight:600;
    cursor:pointer; transition:all 0.15s; margin-top:8px;
  }
  .btn-primary:active { transform:scale(0.98); }
  .btn-danger { background:linear-gradient(135deg, var(--danger), #c0392b); color:#fff; }

  /* SETTINGS PANEL */
  .settings-item {
    background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; margin-bottom:8px;
  }
  .settings-label { font-size:14px; }
  .settings-val { font-family:var(--mono); font-size:13px; color:var(--text2); }

  /* CHART BAR */
  .chart-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; align-items:flex-end; height:80px; margin-bottom:8px; }
  .chart-bar-wrap { display:flex; flex-direction:column; align-items:center; height:100%; }
  .chart-bar { width:100%; border-radius:4px 4px 0 0; transition:height 0.5s ease; min-height:3px; }
  .chart-day-label { font-size:8px; color:var(--text3); margin-top:4px; font-family:var(--mono); }

  /* STATS VIEW */
  .stat-row { display:flex; align-items:center; gap:12px; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:8px; }
  .stat-bar-bg { flex:1; height:8px; background:var(--surface2); border-radius:4px; overflow:hidden; }
  .stat-bar-fill { height:100%; border-radius:4px; }
  .stat-label { font-size:12px; min-width:80px; }
  .stat-val { font-family:var(--mono); font-size:12px; min-width:70px; text-align:right; }

  /* EMPTY */
  .empty-state { text-align:center; padding:40px 20px; color:var(--text3); }
  .empty-icon { font-size:48px; margin-bottom:12px; opacity:0.4; }
  .empty-text { font-size:14px; }

  /* DELETE swipe hint */
  .delete-btn { background:var(--danger); border:none; color:#fff; border-radius:10px; padding:8px 16px; font-size:13px; cursor:pointer; }
  .action-row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }

  /* TOAST */
  #toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 20px; font-size:13px; color:var(--text); opacity:0; transition:all 0.3s; z-index:400; white-space:nowrap; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>

<div id="app-header">
  <div>
    <div class="header-title">💰 Orçamento</div>
    <div class="header-month" id="header-month-label">Carregando...</div>
  </div>
  <button id="btn-settings" onclick="openSettings()">⚙️</button>
</div>

<div id="main-scroll">
  <div id="view-home"></div>
  <div id="view-stats" style="display:none"></div>
  <div id="view-fixed" style="display:none"></div>
</div>

<nav id="bottom-nav">
  <button class="nav-btn active" onclick="switchView('home')" id="nav-home"><span class="nav-icon">🏠</span><span class="nav-label">Início</span></button>
  <button class="nav-btn" onclick="switchView('stats')" id="nav-stats"><span class="nav-icon">📊</span><span class="nav-label">Análise</span></button>
  <button class="nav-btn" onclick="switchView('fixed')" id="nav-fixed"><span class="nav-icon">📌</span><span class="nav-label">Fixos</span></button>
</nav>

<button id="fab" onclick="openAddModal()">+</button>

<!-- ADD TRANSACTION MODAL -->
<div class="modal-overlay" id="modal-add">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-add-title">Nova Transação</div>
    <div class="type-selector">
      <div class="type-btn income selected" onclick="selectType('income',this)"><span class="type-emoji">💚</span>Receita</div>
      <div class="type-btn expense" onclick="selectType('expense',this)"><span class="type-emoji">🔴</span>Gasto Diário</div>
      <div class="type-btn fixed" onclick="selectType('fixed',this)"><span class="type-emoji">📌</span>Conta Fixa</div>
    </div>
    <br>
    <div class="form-group">
      <label class="form-label">Descrição</label>
      <input class="form-input" id="input-desc" placeholder="Ex: Mercado, Salário..." type="text" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">Valor (R$)</label>
      <input class="form-input" id="input-amount" placeholder="0,00" type="number" step="0.01" min="0" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label">Data</label>
      <input class="form-input" id="input-date" type="date">
    </div>
    <div class="form-group" id="group-day" style="display:none">
      <label class="form-label">Dia de Vencimento</label>
      <input class="form-input" id="input-day" placeholder="Ex: 15" type="number" min="1" max="31">
    </div>
    <div class="form-group">
      <label class="form-label">Categoria</label>
      <select class="form-input" id="input-cat">
        <option value="outros">Outros</option>
        <option value="alimentacao">🍔 Alimentação</option>
        <option value="transporte">🚗 Transporte</option>
        <option value="moradia">🏠 Moradia</option>
        <option value="saude">💊 Saúde</option>
        <option value="lazer">🎉 Lazer</option>
        <option value="educacao">📚 Educação</option>
        <option value="salario">💼 Salário</option>
        <option value="freelance">💻 Freelance</option>
        <option value="investimento">📈 Investimento</option>
        <option value="cartao">💳 Cartão</option>
        <option value="agua">💧 Água</option>
        <option value="luz">⚡ Luz</option>
        <option value="internet">📡 Internet</option>
        <option value="aluguel">🏡 Aluguel</option>
      </select>
    </div>
    <button class="btn-primary" onclick="saveTransaction()" id="btn-save-tx">Salvar Transação</button>
    <div class="action-row" id="delete-action" style="display:none">
      <button class="delete-btn" onclick="deleteTransaction()">🗑 Excluir</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="modal-settings">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Configurações</div>
    <div id="settings-content"></div>
    <button class="btn-primary" onclick="saveSettings()">Salvar</button>
    <br><br>
    <button class="btn-primary btn-danger" onclick="if(confirm('Apagar TODOS os dados deste mês?')) clearMonthData()">🗑 Limpar Dados do Mês</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let currentView = 'home';
let currentDate = new Date();
let currentMonth, currentYear;
let editingId = null;
let selectedType = 'income';
let settings = {};
let data = {}; // { 'YYYY-MM': { transactions: [], fixedExpenses: [] } }

const CAT_ICONS = {
  alimentacao:'🍔', transporte:'🚗', moradia:'🏠', saude:'💊',
  lazer:'🎉', educacao:'📚', salario:'💼', freelance:'💻',
  investimento:'📈', cartao:'💳', agua:'💧', luz:'⚡',
  internet:'📡', aluguel:'🏡', outros:'📋'
};

// ═══════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════
function loadAll() {
  try {
    const raw = localStorage.getItem('orcamento_data');
    data = raw ? JSON.parse(raw) : {};
    const rawS = localStorage.getItem('orcamento_settings');
    settings = rawS ? JSON.parse(rawS) : { specialBalance: 0, savingsGoal: 30 };
  } catch(e) { data = {}; settings = { specialBalance: 0, savingsGoal: 30 }; }
}
function saveAll() {
  localStorage.setItem('orcamento_data', JSON.stringify(data));
  localStorage.setItem('orcamento_settings', JSON.stringify(settings));
}
function getMonthKey() { return `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`; }
function getMonthData() {
  const key = getMonthKey();
  if (!data[key]) data[key] = { transactions: [], fixedExpenses: [] };
  return data[key];
}

// ═══════════════════════════════════════════
// COMPUTATIONS
// ═══════════════════════════════════════════
function compute() {
  const md = getMonthData();
  const txs = md.transactions || [];
  const fixed = md.fixedExpenses || [];
  let income = 0, expense = 0, fixedTotal = 0;
  txs.forEach(t => {
    if (t.type === 'income') income += t.amount;
    else if (t.type === 'expense') expense += t.amount;
    else if (t.type === 'fixed') fixedTotal += t.amount;
  });
  // Also sum fixed expenses defined in fixed panel
  fixed.forEach(f => fixedTotal += f.amount);
  const balance = income - expense - fixedTotal;
  const special = parseFloat(settings.specialBalance) || 0;
  const available = balance + special;
  return { income, expense, fixedTotal, balance, available, txs, fixed };
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function renderAll() {
  currentMonth = currentDate.getMonth();
  currentYear = currentDate.getFullYear();
  document.getElementById('header-month-label').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
  if (currentView === 'home') renderHome();
  else if (currentView === 'stats') renderStats();
  else if (currentView === 'fixed') renderFixed();
}

function renderHome() {
  const { income, expense, fixedTotal, balance, available, txs } = compute();
  const spentRatio = income > 0 ? Math.min(1, (expense+fixedTotal)/income) : 0;
  const balanceClass = balance >= 0 ? 'positive' : 'negative';
  const sign = balance >= 0 ? '+' : '';
  const special = parseFloat(settings.specialBalance) || 0;

  // Group txs by day
  const byDay = {};
  txs.forEach(t => {
    const d = t.date || t.createdAt?.split('T')[0] || '';
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(t);
  });
  const days = Object.keys(byDay).sort().reverse();

  let txHTML = '';
  if (txs.length === 0) {
    txHTML = `<div class="empty-state"><div class="empty-icon">📒</div><div class="empty-text">Nenhuma transação este mês.<br>Toque em + para adicionar.</div></div>`;
  } else {
    days.forEach(day => {
      const dayTxs = byDay[day];
      const [y,m,d] = day.split('-');
      txHTML += `<div class="section-title">${d}/${m}</div><div class="tx-list">`;
      dayTxs.forEach(t => {
        const icon = CAT_ICONS[t.category] || '📋';
        const cls = t.type === 'income' ? 'income' : t.type === 'fixed' ? 'fixed-expense' : 'expense';
        const amtSign = t.type === 'income' ? '+' : '-';
        txHTML += `<div class="tx-item ${cls}" onclick="editTransaction('${t.id}')">
          <div class="tx-icon ${cls}">${icon}</div>
          <div class="tx-info">
            <div class="tx-desc">${t.description}</div>
            <div class="tx-meta">${t.type === 'income' ? 'Receita' : t.type === 'fixed' ? 'Conta Fixa' : 'Gasto'}</div>
          </div>
          <div class="tx-amount ${cls}">${amtSign}R$${fmt(t.amount)}</div>
        </div>`;
      });
      txHTML += `</div>`;
    });
  }

  const bar1 = Math.round(spentRatio*100);
  const savingsPct = income > 0 ? Math.max(0, Math.round((income-expense-fixedTotal)/income*100)) : 0;

  document.getElementById('view-home').innerHTML = `
    <div style="margin-bottom:16px"></div>
    <div class="month-nav">
      <button class="month-nav-btn" onclick="changeMonth(-1)">◀</button>
      <div class="month-nav-label">${MONTHS[currentMonth]} ${currentYear}</div>
      <button class="month-nav-btn" onclick="changeMonth(1)">▶</button>
    </div>
    <div class="summary-card">
      <div class="summary-label">Saldo do Mês</div>
      <div class="summary-value ${balanceClass}">${sign}R$${fmt(balance)}</div>
      ${special !== 0 ? `<div style="font-size:12px;color:var(--text2);margin-top:4px">Cheque Especial: R$${fmt(special)} → Disponível: <span style="color:var(--accent)">R$${fmt(available)}</span></div>` : ''}
      <div class="summary-row">
        <div class="summary-mini">
          <div class="val" style="color:var(--accent)">R$${fmt(income)}</div>
          <div class="lbl">Receitas</div>
        </div>
        <div class="summary-mini">
          <div class="val" style="color:var(--danger)">R$${fmt(expense)}</div>
          <div class="lbl">Gastos Diários</div>
        </div>
        <div class="summary-mini">
          <div class="val" style="color:var(--warning)">R$${fmt(fixedTotal)}</div>
          <div class="lbl">Contas Fixas</div>
        </div>
      </div>
      <div class="progress-section">
        <div class="progress-label"><span>Comprometimento</span><span>${bar1}%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${bar1}%;background:${bar1>80?'var(--danger)':bar1>60?'var(--warning)':'var(--accent)'}"></div></div>
      </div>
      <div class="progress-section">
        <div class="progress-label"><span>Economia</span><span>${savingsPct}%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${savingsPct}%;background:var(--accent2)"></div></div>
      </div>
    </div>
    <div class="section-title">Transações</div>
    ${txHTML}
    <div style="height:20px"></div>
  `;
}

function renderStats() {
  const { income, expense, fixedTotal, txs } = compute();
  // Category breakdown
  const cats = {};
  txs.filter(t=>t.type==='expense').forEach(t => {
    const c = t.category || 'outros';
    cats[c] = (cats[c]||0) + t.amount;
  });
  const sortedCats = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const maxCat = sortedCats.length ? sortedCats[0][1] : 1;

  // Daily chart - last 7 days
  const today = new Date();
  const days7 = [];
  for(let i=6;i>=0;i--) {
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    days7.push(d);
  }
  const dailyExp = days7.map(d => {
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return txs.filter(t=>t.date===key&&t.type==='expense').reduce((s,t)=>s+t.amount,0);
  });
  const maxDay = Math.max(...dailyExp, 1);

  let chartHTML = `<div class="chart-grid">`;
  days7.forEach((d,i) => {
    const h = Math.round((dailyExp[i]/maxDay)*100);
    const color = dailyExp[i] > 0 ? 'var(--danger)' : 'var(--border)';
    chartHTML += `<div class="chart-bar-wrap">
      <div class="chart-bar" style="height:${h}%;background:${color};width:100%"></div>
      <div class="chart-day-label">${d.getDate()}</div>
    </div>`;
  });
  chartHTML += `</div>`;

  let catsHTML = sortedCats.length ? '' : `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">Sem gastos registrados ainda</div></div>`;
  sortedCats.forEach(([cat,val]) => {
    const pct = Math.round((val/maxCat)*100);
    catsHTML += `<div class="stat-row">
      <div class="stat-label">${CAT_ICONS[cat]||'📋'} ${cat}</div>
      <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%;background:var(--danger)"></div></div>
      <div class="stat-val" style="color:var(--danger)">-R$${fmt(val)}</div>
    </div>`;
  });

  // Month comparison
  const prevDate = new Date(currentDate);
  prevDate.setMonth(prevDate.getMonth()-1);
  const prevKey = `${prevDate.getFullYear()}-${String(prevDate.getMonth()+1).padStart(2,'0')}`;
  const prevData = data[prevKey];
  let compHTML = '';
  if(prevData) {
    const prevTxs = prevData.transactions||[];
    const prevExp = prevTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const diff = expense - prevExp;
    const diffSign = diff >= 0 ? '+' : '';
    compHTML = `<div class="summary-mini" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:16px">
      <div class="lbl" style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px">vs Mês Anterior</div>
      <div style="font-family:var(--mono);font-size:16px;font-weight:700;color:${diff<=0?'var(--accent)':'var(--danger)'};margin-top:4px">${diffSign}R$${fmt(Math.abs(diff))}</div>
    </div>`;
  }

  document.getElementById('view-stats').innerHTML = `
    <div style="margin-bottom:16px"></div>
    <div class="month-nav">
      <button class="month-nav-btn" onclick="changeMonth(-1)">◀</button>
      <div class="month-nav-label">${MONTHS[currentMonth]} ${currentYear}</div>
      <button class="month-nav-btn" onclick="changeMonth(1)">▶</button>
    </div>
    <div class="summary-card">
      <div class="summary-label">Gastos Últimos 7 Dias</div>
      <div style="margin-top:12px">${chartHTML}</div>
    </div>
    ${compHTML}
    <div class="section-title">Gastos por Categoria</div>
    ${catsHTML}
    <div style="height:20px"></div>
  `;
}

function renderFixed() {
  const md = getMonthData();
  const fixed = md.fixedExpenses || [];
  const total = fixed.reduce((s,f)=>s+f.amount,0);

  let listHTML = fixed.length ? '' : `<div class="empty-state"><div class="empty-icon">📌</div><div class="empty-text">Nenhuma conta fixa cadastrada.<br>Toque em + para adicionar.</div></div>`;
  fixed.sort((a,b)=>a.dueDay-b.dueDay).forEach(f => {
    listHTML += `<div class="fixed-card" onclick="editFixed('${f.id}')">
      <div class="fixed-card-left">
        <div class="fixed-day-badge">Dia ${f.dueDay}</div>
        <div>
          <div style="font-size:14px;font-weight:500">${f.description}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${CAT_ICONS[f.category]||'📋'} ${f.category}</div>
        </div>
      </div>
      <div style="font-family:var(--mono);font-size:15px;font-weight:700;color:var(--warning)">-R$${fmt(f.amount)}</div>
    </div>`;
  });

  document.getElementById('view-fixed').innerHTML = `
    <div style="margin-bottom:16px"></div>
    <div class="summary-card">
      <div class="summary-label">Total Contas Fixas</div>
      <div class="summary-value" style="color:var(--warning)">R$${fmt(total)}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:6px">${fixed.length} conta(s) cadastrada(s)</div>
    </div>
    <div class="section-title">Contas Fixas</div>
    <div class="tx-list">${listHTML}</div>
    <div style="height:20px"></div>
  `;
}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
function switchView(v) {
  currentView = v;
  ['home','stats','fixed'].forEach(name => {
    document.getElementById(`view-${name}`).style.display = name===v ? 'block' : 'none';
    const btn = document.getElementById(`nav-${name}`);
    btn.classList.toggle('active', name===v);
  });
  renderAll();
}

function changeMonth(delta) {
  currentDate.setMonth(currentDate.getMonth()+delta);
  renderAll();
}

// ═══════════════════════════════════════════
// MODALS
// ═══════════════════════════════════════════
function openAddModal() {
  editingId = null;
  selectedType = 'income';
  document.getElementById('modal-add-title').textContent = 'Nova Transação';
  document.getElementById('input-desc').value = '';
  document.getElementById('input-amount').value = '';
  const today = new Date();
  document.getElementById('input-date').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  document.getElementById('input-cat').value = 'outros';
  document.getElementById('input-day').value = '';
  document.getElementById('group-day').style.display='none';
  document.getElementById('delete-action').style.display='none';
  document.getElementById('btn-save-tx').textContent = 'Salvar Transação';
  // Reset type buttons
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('selected'));
  document.querySelector('.type-btn.income').classList.add('selected');
  document.getElementById('modal-add').classList.add('open');
}

function editTransaction(id) {
  const md = getMonthData();
  const t = md.transactions.find(x=>x.id===id);
  if(!t) return;
  editingId = id;
  selectedType = t.type;
  document.getElementById('modal-add-title').textContent = 'Editar Transação';
  document.getElementById('input-desc').value = t.description;
  document.getElementById('input-amount').value = t.amount;
  document.getElementById('input-date').value = t.date;
  document.getElementById('input-cat').value = t.category||'outros';
  document.getElementById('group-day').style.display='none';
  document.getElementById('delete-action').style.display='flex';
  document.getElementById('btn-save-tx').textContent = 'Atualizar';
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('selected'));
  const cls = t.type==='fixed' ? '.type-btn.fixed' : `.type-btn.${t.type}`;
  const el = document.querySelector(cls);
  if(el) el.classList.add('selected');
  document.getElementById('modal-add').classList.add('open');
}

function editFixed(id) {
  const md = getMonthData();
  const f = (md.fixedExpenses||[]).find(x=>x.id===id);
  if(!f) return;
  editingId = id;
  selectedType = 'fixed';
  document.getElementById('modal-add-title').textContent = 'Editar Conta Fixa';
  document.getElementById('input-desc').value = f.description;
  document.getElementById('input-amount').value = f.amount;
  const today = new Date();
  document.getElementById('input-date').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(f.dueDay).padStart(2,'0')}`;
  document.getElementById('input-cat').value = f.category||'outros';
  document.getElementById('input-day').value = f.dueDay;
  document.getElementById('group-day').style.display='block';
  document.getElementById('delete-action').style.display='flex';
  document.getElementById('btn-save-tx').textContent = 'Atualizar';
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('selected'));
  document.querySelector('.type-btn.fixed').classList.add('selected');
  document.getElementById('modal-add').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.getElementById('modal-add').addEventListener('click', e => { if(e.target===document.getElementById('modal-add')) closeModal('modal-add'); });
document.getElementById('modal-settings').addEventListener('click', e => { if(e.target===document.getElementById('modal-settings')) closeModal('modal-settings'); });

function selectType(type, el) {
  selectedType = type;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('group-day').style.display = type==='fixed' ? 'block' : 'none';
}

function saveTransaction() {
  const desc = document.getElementById('input-desc').value.trim();
  const amount = parseFloat(document.getElementById('input-amount').value);
  const date = document.getElementById('input-date').value;
  const cat = document.getElementById('input-cat').value;
  const dueDay = parseInt(document.getElementById('input-day').value)||1;

  if(!desc) { toast('Digite uma descrição'); return; }
  if(!amount || amount<=0) { toast('Digite um valor válido'); return; }
  if(!date) { toast('Selecione uma data'); return; }

  const md = getMonthData();

  if(selectedType === 'fixed') {
    if(!md.fixedExpenses) md.fixedExpenses=[];
    if(editingId) {
      const idx = md.fixedExpenses.findIndex(f=>f.id===editingId);
      if(idx>=0) md.fixedExpenses[idx] = {...md.fixedExpenses[idx], description:desc, amount, category:cat, dueDay};
    } else {
      md.fixedExpenses.push({id:uid(), description:desc, amount, category:cat, dueDay, createdAt:new Date().toISOString()});
    }
  } else {
    if(!md.transactions) md.transactions=[];
    if(editingId) {
      const idx = md.transactions.findIndex(t=>t.id===editingId);
      if(idx>=0) md.transactions[idx] = {...md.transactions[idx], description:desc, amount, date, category:cat, type:selectedType};
    } else {
      md.transactions.push({id:uid(), description:desc, amount, date, category:cat, type:selectedType, createdAt:new Date().toISOString()});
    }
  }
  saveAll();
  closeModal('modal-add');
  toast(editingId ? '✅ Atualizado!' : '✅ Salvo!');
  editingId = null;
  renderAll();
}

function deleteTransaction() {
  if(!editingId) return;
  const md = getMonthData();
  md.transactions = (md.transactions||[]).filter(t=>t.id!==editingId);
  md.fixedExpenses = (md.fixedExpenses||[]).filter(f=>f.id!==editingId);
  saveAll();
  closeModal('modal-add');
  toast('🗑 Excluído');
  editingId = null;
  renderAll();
}

// ═══════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════
function openSettings() {
  document.getElementById('settings-content').innerHTML = `
    <div class="form-group">
      <label class="form-label">Cheque Especial / Saldo Especial (R$)</label>
      <input class="form-input" id="set-special" type="number" step="0.01" value="${settings.specialBalance||0}" placeholder="Ex: 7150">
      <div style="font-size:11px;color:var(--text3);margin-top:6px">Limite do cheque especial ou saldo extra disponível</div>
    </div>
    <div class="form-group">
      <label class="form-label">Meta de Economia (%)</label>
      <input class="form-input" id="set-savings" type="number" min="0" max="100" value="${settings.savingsGoal||30}" placeholder="Ex: 30">
    </div>
    <br>
    <div style="font-size:11px;color:var(--text3);margin-bottom:16px">📱 Para instalar como app: no Chrome/Android, toque nos 3 pontinhos → "Adicionar à tela inicial"</div>
  `;
  document.getElementById('modal-settings').classList.add('open');
}

function saveSettings() {
  settings.specialBalance = parseFloat(document.getElementById('set-special').value)||0;
  settings.savingsGoal = parseFloat(document.getElementById('set-savings').value)||30;
  saveAll();
  closeModal('modal-settings');
  toast('✅ Configurações salvas');
  renderAll();
}

function clearMonthData() {
  const key = getMonthKey();
  delete data[key];
  saveAll();
  closeModal('modal-settings');
  toast('🗑 Dados do mês apagados');
  renderAll();
}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function fmt(n) {
  if(isNaN(n)||n===undefined) return '0,00';
  return Math.abs(n).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
function uid() { return Date.now().toString(36)+Math.random().toString(36).substr(2,5); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
loadAll();
renderAll();
</script>
</body>
